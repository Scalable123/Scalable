<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f4ee" />
    <meta http-equiv="refresh" content="0; url=./frontend/login.html" />
    <title>Opening your Studio — Scalable</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, Helvetica, sans-serif;
        color: #30382f;
        background: #f6f4ee;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        padding: 32px;
        text-align: center;
      }
      .brand {
        font:
          italic 40px Georgia,
          serif;
        letter-spacing: -2px;
      }
      h1 {
        font:
          normal 28px Georgia,
          serif;
        margin: 28px 0 14px;
      }
      p {
        font-size: 14px;
        line-height: 1.8;
      }
      a {
        color: inherit;
        text-underline-offset: 4px;
      }
      a:focus-visible {
        outline: 2px solid #a64b35;
        outline-offset: 5px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color: #e8e7dd;
          background: #1c211e;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">scalable.</div>
      <h1>Opening your creative space.</h1>
      <p>
        Taking you to the Studio login page.<br />If you stay here,
        <a href="./frontend/login.html">continue to login</a>.
      </p>
    </main>
  </body>
</html>
