<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Choose a new password — Scalable Studio</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/update-password.js"></script>
  </head>
  <body data-page="update-password">
    <main class="login-layout">
      <section class="login-panel" aria-labelledby="update-password-title">
        <p class="eyebrow">SECURE ACCOUNT RECOVERY</p>
        <h1 id="update-password-title">Choose a new password<span>.</span></h1>
        <p class="dialog-copy">Use a password you do not reuse elsewhere.</p>
        <form id="update-password-form" class="import-form">
          <label for="new-password">New password</label>
          <input id="new-password" type="password" minlength="8" maxlength="128" required autocomplete="new-password" />
          <label for="confirm-password">Confirm new password</label>
          <input id="confirm-password" type="password" minlength="8" maxlength="128" required autocomplete="new-password" />
          <button class="done-button login-submit" type="submit">Update password</button>
        </form>
        <p id="update-password-status" class="settings-status" role="status" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>
