name: Deploy Studio to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out the selected ref
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare the static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scalable-pages/frontend"
          cp index.html .nojekyll "$RUNNER_TEMP/scalable-pages/"
          cp -R frontend/. "$RUNNER_TEMP/scalable-pages/frontend/"
      - name: Upload the static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/scalable-pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
